name: frame_video
description: Frame's video surface. On Windows and Linux (X11), a window just under Frame's own, where the video engine draws (with HDR), so Frame's interface can sit on top in one window.
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: FrameVideoPluginCApi
      linux:
        pluginClass: FrameVideoPlugin
