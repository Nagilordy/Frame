# Builds Frame for Linux as one file, Frame-x86_64.AppImage, that runs on most distributions
# (anything at least as new as Ubuntu 24.04 / Fedora 40, which includes Bazzite).
# Runs when a release tag like v0.3 is created (it attaches the AppImage to that release), or
# by hand (Actions tab > Linux AppImage > Run workflow). Uploading files to main doesn't start it.

name: Linux AppImage

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libmpv-dev mpv file desktop-file-utils \
            libcurl4-openssl-dev libx11-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux project files
        run: test -d linux || flutter create --platforms=linux --project-name player_test .

      # Frame's window can be see-through where Frame draws nothing, so the new player's video
      # (drawn under the window, packages/frame_video) shows through behind the controls:
      # an RGBA window and a clear Flutter background. Every screen paints its own background,
      # so nothing else changes.
      - name: See-through window (for the new player)
        run: |
          python3 - <<'PY'
          import re
          p = 'linux/runner/my_application.cc'
          s = open(p).read()
          if 'gdk_screen_get_rgba_visual' not in s:
              m = re.search(r'GtkWindow\* window =[^;]*;\n', s)
              if m:
                  add = ('  {\n'
                         '    GdkScreen* screen = gtk_window_get_screen(window);\n'
                         '    GdkVisual* visual = gdk_screen_get_rgba_visual(screen);\n'
                         '    if (visual != nullptr && gdk_screen_is_composited(screen)) {\n'
                         '      gtk_widget_set_visual(GTK_WIDGET(window), visual);\n'
                         '      gtk_widget_set_app_paintable(GTK_WIDGET(window), TRUE);\n'
                         '    }\n'
                         '  }\n')
                  s = s[:m.end()] + add + s[m.end():]
                  print('RGBA window: added')
              else:
                  print('::warning::RGBA window: window creation line not found')
          if 'fl_view_set_background_color' in s:
              s = re.sub(r'gdk_rgba_parse\(&background_color, "#[0-9A-Fa-f]+"\)',
                         'gdk_rgba_parse(&background_color, "#00000000")', s)
              print('Clear background: set')
          else:
              m = re.search(r'FlView\* view = fl_view_new\(project\);\n', s)
              if m:
                  add = ('  GdkRGBA frame_clear;\n'
                         '  gdk_rgba_parse(&frame_clear, "#00000000");\n'
                         '  fl_view_set_background_color(view, &frame_clear);\n')
                  s = s[:m.end()] + add + s[m.end():]
                  print('Clear background: added')
              else:
                  print('::warning::Clear background: view creation line not found')
          open(p, 'w').write(s)
          PY
          grep -n "rgba\|background_color\|frame_clear" linux/runner/my_application.cc || true

      - name: Build
        # SENTRY_DSN (a repository secret) turns on crash reports; empty = off.
        run: flutter build linux --release --dart-define=FRAME_BUILD=${GITHUB_SHA::7} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Pack the AppImage
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p $APPDIR/usr/bin $APPDIR/usr/share/applications $APPDIR/usr/share/icons/hicolor/512x512/apps
          # The app keeps its own layout next to the program (lib/ and data/ beside it).
          cp -r build/linux/x64/release/bundle/* $APPDIR/usr/bin/
          cp packaging/frame.desktop $APPDIR/usr/share/applications/frame.desktop
          cp packaging/frame.png $APPDIR/usr/share/icons/hicolor/512x512/apps/frame.png

          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh packaging/AppRun

          # Every library Frame and its video player need, so nothing has to be installed.
          LIBS=""
          for l in $APPDIR/usr/bin/lib/*.so; do LIBS="$LIBS --library $l"; done
          MPVLIB=$(ls /usr/lib/x86_64-linux-gnu/libmpv.so.2* | head -1)

          export DEPLOY_GTK_VERSION=3
          export APPIMAGE_EXTRACT_AND_RUN=1
          OUTPUT=Frame-x86_64.AppImage ./linuxdeploy-x86_64.AppImage \
            --appdir $APPDIR \
            --executable $APPDIR/usr/bin/player_test \
            $LIBS --library $MPVLIB \
            --desktop-file $APPDIR/usr/share/applications/frame.desktop \
            --icon-file packaging/frame.png \
            --custom-apprun packaging/AppRun \
            --plugin gtk \
            --output appimage

      - uses: actions/upload-artifact@v4
        with:
          name: Frame-Linux
          path: Frame-x86_64.AppImage

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Frame-x86_64.AppImage
