name: Build iPhone IPA

# Only when started by hand (Actions tab > Build iPhone IPA > Run workflow): Frame has no
# iPhone setup yet, so running it on every upload would just fail each time.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The video plugin (media_kit_video, from the community fork in pubspec.yaml) only finds
      # its iPhone video libraries through CocoaPods. With Flutter's newer Swift Package Manager
      # it builds an empty placeholder instead, and playback fails with "MissingPluginException
      # ... VideoOutputManager.Create" / "No render context set". So: CocoaPods.
      - name: Use CocoaPods for plugins (needed for video)
        run: flutter config --no-enable-swift-package-manager

      - name: Create the iPhone project files
        run: flutter create --platforms=ios --org com.kevin .

      # On the home screen: "Frame" under Frame's icon, instead of Flutter's template name and icon.
      # Every icon size Xcode asks for is made from packaging/ios/AppIcon-1024.png (no
      # transparency, square: iOS rounds the corners itself).
      - name: Frame's name and icon on the home screen
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Frame" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Frame" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName Frame" "$PLIST" || true
          ICONS=ios/Runner/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONS"/*.png; do
            px=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            sips -s format png -z "$px" "$px" packaging/ios/AppIcon-1024.png --out "$f" >/dev/null
          done
          ls "$ICONS"

      - name: Allow your NAS over http and on the home network
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Connects to your Jellyfin server on your home network.'" "$PLIST" || true

      - name: Upright and sideways (screens without an upright layout turn sideways by themselves)
        run: |
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:1 string UIInterfaceOrientationLandscapeLeft" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:2 string UIInterfaceOrientationLandscapeRight" "$PLIST"
          # Lets the app pick its own orientation per screen (iPad: no split-screen multitasking).
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" || true

      - name: Install packages
        run: flutter pub get

      - name: Build the app without signing
        # The commit goes into the app, shown in the "Why isn't it playing?" box.
        run: flutter build ios --release --no-codesign --dart-define=FRAME_BUILD=${GITHUB_SHA::7}

      - name: Check the video libraries made it into the app (warning only)
        run: |
          ls build/ios/iphoneos/Runner.app/Frameworks
          ls build/ios/iphoneos/Runner.app/Frameworks | grep -qi '^mpv' || echo "::warning::Mpv framework not found in the app: video may not play"

      # The video plugin has a "stub" version with no player inside, used when it can't find the
      # mpv libraries at build time. An app built with it opens videos with sound but no picture
      # ("MissingPluginException ... VideoOutputManager.Create"). Stop here instead of shipping it.
      - name: Check the real video plugin is inside (not the empty stub)
        run: |
          bin=build/ios/iphoneos/Runner.app/Frameworks/media_kit_video.framework/media_kit_video
          if [ ! -f "$bin" ]; then echo "::error::media_kit_video.framework is missing from the app"; exit 1; fi
          if strings "$bin" | grep -q 'VideoOutputManager.Create'; then
            echo "Video plugin OK (real player inside)"
          else
            echo "::error::The video plugin is the empty stub: videos would play with no picture. Not packaging this build."
            exit 1
          fi

      - name: Package as an IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr player-test.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: player-test-ipa
          path: player-test.ipa
