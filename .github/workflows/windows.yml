# Builds Frame for Windows and packs it into one installer, FrameSetup.exe.
# Runs on GitHub's Windows machines when a release tag like v0.3 is created (it attaches
# FrameSetup.exe to that release), or by hand (Actions tab > Windows installer > Run workflow).
# Uploading files to main doesn't start it.

name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Adds the Windows part of the project if it isn't in the repository yet.
      - name: Windows project files
        shell: pwsh
        run: if (-not (Test-Path windows)) { flutter create --platforms=windows --project-name player_test . }

      # Frame's own icon (taskbar, window, Start menu, .exe) instead of Flutter's default.
      - name: Frame icon
        shell: pwsh
        run: Copy-Item packaging\app_icon.ico windows\runner\resources\app_icon.ico -Force

      # "Frame" everywhere Windows shows a name, instead of the project's internal name
      # (player_test): the program is Frame.exe, and Task Manager, the taskbar, "Open with" and
      # the window's first title all say Frame.
      - name: Frame's name on Windows
        shell: pwsh
        run: |
          $cmake = 'windows\CMakeLists.txt'
          (Get-Content $cmake -Raw) -replace 'set\(BINARY_NAME "[^"]*"\)', 'set(BINARY_NAME "Frame")' | Set-Content $cmake -NoNewline
          $rc = 'windows\runner\Runner.rc'
          $t = Get-Content $rc -Raw
          # CompanyName and ProductName stay as they were: Windows keeps Frame's settings, sign-in
          # and downloads in a folder named after them, so changing them would lose everything.
          $t = $t -replace '(VALUE "FileDescription", )"[^"]*"', '$1"Frame"'
          $t = $t -replace '(VALUE "InternalName", )"[^"]*"', '$1"Frame"'
          $t = $t -replace '(VALUE "OriginalFilename", )"[^"]*"', '$1"Frame.exe"'
          Set-Content $rc $t -NoNewline
          $main = 'windows\runner\main.cpp'
          (Get-Content $main -Raw) -replace 'window\.Create\(L"[^"]*"', 'window.Create(L"Frame"' | Set-Content $main -NoNewline
          Select-String -Path $cmake -Pattern 'BINARY_NAME'
          Select-String -Path $rc -Pattern 'FileDescription|OriginalFilename'
          Select-String -Path $main -Pattern 'window.Create'

      - name: Build
        # SENTRY_DSN (a repository secret) turns on crash reports; empty = off.
        run: flutter build windows --release --dart-define=FRAME_BUILD=${{ github.sha }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      # mpv plays the videos in its own window, like on Linux: real HDR, Dolby Vision and
      # TrueHD. The current Windows build of mpv goes next to Frame (Frame finds it there).
      - name: Add mpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          # The plain 64-bit player (not the -v3 build for newer CPUs only, not the -dev files).
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-.*\.7z$' -and $_.name -notmatch 'v3' } | Select-Object -First 1 }
          if (-not $asset) { throw "No mpv build found in $($release.tag_name): $($release.assets.name -join ', ')" }
          Write-Host "mpv: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -obuild\windows\x64\runner\Release\mpv -y
          if (-not (Test-Path build\windows\x64\runner\Release\mpv\mpv.exe)) { throw "mpv.exe missing after unpacking" }

      # While a video plays, the player (mpv) is its own window: give it Frame's icon and name,
      # so the taskbar shows Frame's icon instead of mpv's.
      - name: Frame's icon on the player
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo electron/rcedit --pattern 'rcedit-x64.exe' --dir .
          .\rcedit-x64.exe build\windows\x64\runner\Release\mpv\mpv.exe `
            --set-icon packaging\app_icon.ico `
            --set-version-string FileDescription "Frame" `
            --set-version-string ProductName "Frame"
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed" }
          if (-not (Test-Path build\windows\x64\runner\Release\Frame.exe)) { throw "Frame.exe missing: the rename didn't apply" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Make the installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.1.$env:GITHUB_RUN_NUMBER" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\frame.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FrameSetup
          path: installer\Output\FrameSetup.exe

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/FrameSetup.exe
