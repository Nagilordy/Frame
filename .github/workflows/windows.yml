# Builds Frame for Windows and packs it into one installer, FrameSetup.exe.
# Runs on GitHub's Windows machines when a release tag like v0.3 is created (it attaches
# FrameSetup.exe to that release), or by hand (Actions tab > Windows installer > Run workflow).
# Uploading files to main doesn't start it.

name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Adds the Windows part of the project if it isn't in the repository yet.
      - name: Windows project files
        shell: pwsh
        run: if (-not (Test-Path windows)) { flutter create --platforms=windows --project-name player_test . }

      # Frame's own icon (taskbar, window, Start menu, .exe) instead of Flutter's default.
      - name: Frame icon
        shell: pwsh
        run: Copy-Item packaging\app_icon.ico windows\runner\resources\app_icon.ico -Force

      - name: Build
        run: flutter build windows --release

      # mpv plays the videos in its own window, like on Linux: real HDR, Dolby Vision and
      # TrueHD. The current Windows build of mpv goes next to Frame (Frame finds it there).
      - name: Add mpv
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh api repos/shinchiro/mpv-winbuild-cmake/releases/latest | ConvertFrom-Json
          # The plain 64-bit player (not the -v3 build for newer CPUs only, not the -dev files).
          $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-\d{8}-git-.*\.7z$' } | Select-Object -First 1
          if (-not $asset) { $asset = $release.assets | Where-Object { $_.name -match '^mpv-x86_64-.*\.7z$' -and $_.name -notmatch 'v3' } | Select-Object -First 1 }
          if (-not $asset) { throw "No mpv build found in $($release.tag_name): $($release.assets.name -join ', ')" }
          Write-Host "mpv: $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -obuild\windows\x64\runner\Release\mpv -y
          if (-not (Test-Path build\windows\x64\runner\Release\mpv\mpv.exe)) { throw "mpv.exe missing after unpacking" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Make the installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.1.$env:GITHUB_RUN_NUMBER" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\frame.iss

      - uses: actions/upload-artifact@v4
        with:
          name: FrameSetup
          path: installer\Output\FrameSetup.exe

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/FrameSetup.exe
